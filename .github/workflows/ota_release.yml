name: OTA release

# Builds firmware.bin and littlefs.bin and publishes them as a GitHub release, when:
#   - data/version.txt changes on main (the release and its tag v<version> are created here), or
#   - a tag such as v1.2.1 is pushed, or
#   - the workflow is started by hand from the Actions tab.
# The clock installs them from "Update over WiFi" > "Check GitHub for updates".
# (Tags starting with "v-" are left to the upstream GitHub Pages workflow.)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/version.txt
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Filesystem builds compile the clock preview (web/emulator/build.mjs) with Emscripten.
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(node web/emulator/build.mjs --emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-emsdk-${{ steps.emsdk.outputs.version }}
      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ steps.emsdk.outputs.version }}
          ~/emsdk/emsdk activate ${{ steps.emsdk.outputs.version }}

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf '%s' "$version" > data/version.txt
          else
            version="$(tr -d '[:space:]' < data/version.txt)"
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version $version"

      - name: Build firmware
        if: steps.version.outputs.skip != 'true'
        run: pio run --environment ulanzi
      - name: Build filesystem image
        if: steps.version.outputs.skip != 'true'
        run: pio run --target buildfs --environment ulanzi

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # partitions.bin and boot_app0.bin are only for the first USB flash (scripts/first_ota_flash.py)
          gh release create "$TAG" \
            .pio/build/ulanzi/firmware.bin \
            .pio/build/ulanzi/littlefs.bin \
            .pio/build/ulanzi/partitions.bin \
            ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "firmware.bin and littlefs.bin: over-the-air updates. partitions.bin and boot_app0.bin: first USB flash with scripts/first_ota_flash.py."
