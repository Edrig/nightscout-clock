name: OTA release

# Builds firmware.bin and littlefs.bin and publishes them as a GitHub release, when:
#   - data/version.txt changes on main (the release and its tag v<version> are created here), or
#   - a tag such as v1.2.1 is pushed, or
#   - the workflow is started by hand from the Actions tab.
# The clock installs them from "Update over WiFi" > "Check GitHub for updates".
# (Tags starting with "v-" are left to the upstream GitHub Pages workflow.)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/version.txt
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf '%s' "$version" > data/version.txt
          else
            version="$(tr -d '[:space:]' < data/version.txt)"
          fi
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version $version"

      - name: Build firmware
        if: steps.version.outputs.skip != 'true'
        run: pio run --environment ulanzi
      - name: Build filesystem image
        if: steps.version.outputs.skip != 'true'
        run: pio run --target buildfs --environment ulanzi

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            .pio/build/ulanzi/firmware.bin \
            .pio/build/ulanzi/littlefs.bin \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Firmware and filesystem image for over-the-air updates."
