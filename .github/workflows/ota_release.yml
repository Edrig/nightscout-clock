name: OTA release

# Builds firmware.bin and littlefs.bin and publishes them as a GitHub release, when:
#   - data/version.txt changes on main (the release and its tag v<version> are created here), or
#   - a tag such as v1.2.1 is pushed, or
#   - the workflow is started by hand from the Actions tab.
# The clock installs them from "Update over WiFi" > "Check GitHub for updates".
# The web flasher (www-ota/, first USB flash keeping the settings) is deployed to GitHub Pages with the release.
# (Tags starting with "v-" are left to the upstream GitHub Pages workflow.)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - data/version.txt
      - "www-ota/**"
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # The clock updates from this repository's releases. Set for the whole job: the filesystem build must use
      # the same flags, or PlatformIO cleans the build folder and firmware.bin with it.
      PLATFORMIO_BUILD_FLAGS: -DOTA_GITHUB_REPO=\"${{ github.repository }}\"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio
      # Filesystem builds compile the clock preview (web/emulator/build.mjs) with Emscripten.
      - name: Read the Emscripten version
        id: emsdk
        run: echo "version=$(node web/emulator/build.mjs --emsdk-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/emsdk
          key: ${{ runner.os }}-emsdk-${{ steps.emsdk.outputs.version }}
      - name: Install Emscripten
        run: |
          [ -d ~/emsdk ] || git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ steps.emsdk.outputs.version }}
          ~/emsdk/emsdk activate ${{ steps.emsdk.outputs.version }}

      - name: Work out the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
            printf '%s' "$version" > data/version.txt
          else
            version="$(tr -d '[:space:]' < data/version.txt)"
          fi
          # The firmware's VERSION (boot screen, logs) always matches version.txt
          sed -i "s/^#define VERSION \".*\"/#define VERSION \"$version\"/" src/globals.h
          grep -n '^#define VERSION' src/globals.h
          tag="v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Building version $version"

      - name: Build firmware
        if: steps.version.outputs.skip != 'true'
        run: |
          pio run --environment ulanzi
          grep -q "repos/${{ github.repository }}/releases/latest" .pio/build/ulanzi/firmware.bin \
            || { echo "::error::firmware.bin does not update from ${{ github.repository }}"; exit 1; }
      - name: Build filesystem image
        if: steps.version.outputs.skip != 'true'
        run: pio run --target buildfs --environment ulanzi

      - name: Publish the release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # partitions.bin and boot_app0.bin are only for the first USB flash (scripts/first_ota_flash.py)
          gh release create "$TAG" \
            .pio/build/ulanzi/firmware.bin \
            .pio/build/ulanzi/littlefs.bin \
            .pio/build/ulanzi/partitions.bin \
            ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "firmware.bin and littlefs.bin: over-the-air updates. partitions.bin and boot_app0.bin: first USB flash with scripts/first_ota_flash.py."

      # When the release already exists (only the page changed), the page serves that release's files.
      - name: Assemble the web flasher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILT: ${{ steps.version.outputs.skip != 'true' }}
        run: |
          mkdir -p site/firmware
          cp -r www-ota/. site/
          if [ "$BUILT" = true ]; then
            cp .pio/build/ulanzi/firmware.bin .pio/build/ulanzi/littlefs.bin .pio/build/ulanzi/partitions.bin site/firmware/
            cp ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin site/firmware/
          else
            gh release download "$TAG" --dir site/firmware \
              --pattern firmware.bin --pattern littlefs.bin --pattern partitions.bin --pattern boot_app0.bin
          fi
          python3 - <<'PY'
          import hashlib, json, os
          d = "site/firmware"
          names = ["partitions.bin", "boot_app0.bin", "firmware.bin", "littlefs.bin"]
          info = {"tag": os.environ["TAG"], "version": os.environ["VERSION"],
                  "sha256": {n: hashlib.sha256(open(f"{d}/{n}", "rb").read()).hexdigest() for n in names}}
          json.dump(info, open(f"{d}/release.json", "w"), indent=2)
          PY
          touch site/.nojekyll
      - name: Upload the web flasher
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  pages:
    name: Deploy the web flasher
    needs: release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
